{% extends "allauth/layouts/manage.html" %}
{% load crispy_forms_tags %}

{% block title %}
  Editar Perfil - {{ store_name }}
{% endblock title %}

{% block content %}
  <h4 class="fw-bold mb-3"><i class="bi bi-pencil"></i> Editar Perfil</h4>

  <form method="post" action="{% url 'users:update' %}">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-dark">
        <i class="bi bi-check-lg"></i> Guardar cambios
      </button>
      <a href="{% url 'users:detail' request.user.username %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
{% endblock content %}
