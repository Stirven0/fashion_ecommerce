services:
  docs:
    image: fashion_store_local_docs
    container_name: fashion_store_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./fashion_store:/app/fashion_store:z
    ports:
      - '9000:9000'
    command: /start-docs
